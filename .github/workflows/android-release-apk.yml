name: Android Release APK

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to build and attach the APK to
        required: true
        type: string
  workflow_call:
    inputs:
      tag_name:
        description: Release tag created by the caller
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-apk-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      ANDROID_NDK_VERSION: 29.0.14206865
      RELEASE_TAG_NAME: ${{ inputs.tag_name || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag_name || github.ref }}
          fetch-depth: 0

      - name: Verify release tag checkout
        run: |
          if ! git show-ref --verify --quiet "refs/tags/${RELEASE_TAG_NAME}"; then
            echo "Release tag does not exist: ${RELEASE_TAG_NAME}" >&2
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "${RELEASE_TAG_NAME}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "$tag_commit" != "$head_commit" ]]; then
            echo "Checked out $head_commit, but ${RELEASE_TAG_NAME} points to $tag_commit." >&2
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.4.0"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Prepare Flutter workspace
        run: |
          flutter --version
          bash scripts/prepare_flutter_workspace.sh

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Stage APK artifact
        run: |
          mkdir -p artifacts
          tag_name="${RELEASE_TAG_NAME//\//-}"
          artifact_tag="$tag_name"
          if [[ "$tag_name" == *-v[0-9]* ]]; then
            artifact_tag="v${tag_name##*-v}"
          fi
          apk_name="vesper-${artifact_tag}-android-arm64-release.apk"
          apk_path="build/app/outputs/flutter-apk/app-release.apk"
          if [[ ! -f "$apk_path" ]]; then
            apk_path="$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*release*.apk' | sort | head -n 1)"
          fi
          if [[ -z "$apk_path" || ! -f "$apk_path" ]]; then
            echo "Release APK was not found." >&2
            find build/app/outputs -type f -name '*.apk' -print >&2 || true
            exit 1
          fi
          cp "$apk_path" "artifacts/$apk_name"
          (cd artifacts && sha256sum "$apk_name" > "$apk_name.sha256")

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: android-release-apk
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG_NAME }}
          files: artifacts/*
          fail_on_unmatched_files: true
